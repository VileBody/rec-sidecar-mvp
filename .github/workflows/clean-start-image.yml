name: clean-start image

on:
  push:
    branches:
      - main
      - clean_start
    paths:
      - "clean_start/**"
      - "k8s/clean-start.yaml"
      - ".github/workflows/clean-start-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./clean_start/Dockerfile
          push: true
          tags: |
            ghcr.io/vilebody/rec-sidecar-mvp-clean-start:latest
            ghcr.io/vilebody/rec-sidecar-mvp-clean-start:${{ github.sha }}
