name: llm-helper image

on:
  push:
    branches:
      - main
    paths:
      - "llm_service/**"
      - ".github/workflows/llm-helper-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./llm_service
          push: true
          tags: |
            ghcr.io/vilebody/rec-sidecar-mvp:main
            ghcr.io/vilebody/rec-sidecar-mvp:${{ github.sha }}
