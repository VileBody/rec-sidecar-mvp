[package]
name = "rec-sidecar-mvp"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
chrono = "0.4"
cpal = "0.15"
dotenvy = "0.15"
eframe = "0.31"
futures-util = "0.3"
objc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-socks = "0.5"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
