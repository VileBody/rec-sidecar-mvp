apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rec-sidecar
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VileBody/rec-sidecar-mvp.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: rec-sidecar
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
