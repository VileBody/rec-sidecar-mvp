services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CLEAN_START_POSTGRES_DB:-clean_start}
      POSTGRES_USER: ${CLEAN_START_POSTGRES_USER:-clean_start}
      POSTGRES_PASSWORD: ${CLEAN_START_POSTGRES_PASSWORD:-clean_start}
    ports:
      - "${CLEAN_START_POSTGRES_PORT:-5433}:5432"
    volumes:
      - clean-start-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  clean-start:
    build:
      context: ..
      dockerfile: clean_start/Dockerfile
    command: ["--role", "all"]
    ports:
      - "8110:8110"
    environment:
      CLEAN_START_HTTP_ADDR: ":8110"
      CLEAN_START_ROLE: all
      CLEAN_START_AUTH_ENABLED: ${CLEAN_START_AUTH_ENABLED:-true}
      CLEAN_START_DATABASE_URL: ${CLEAN_START_DATABASE_URL:-postgres://clean_start:clean_start@postgres:5432/clean_start?sslmode=disable}
      CLEAN_START_JWT_SECRET: ${CLEAN_START_JWT_SECRET:-dev-clean-start-secret-change-me}
      CLEAN_START_AUTH_COOKIE_SECURE: ${CLEAN_START_AUTH_COOKIE_SECURE:-false}
      CLEAN_START_COACH_ENABLED: ${CLEAN_START_COACH_ENABLED:-false}
      CLEAN_START_STT_PROVIDER: ${CLEAN_START_STT_PROVIDER:-auto}
      CLEAN_START_STAGE_PARTIAL_INTERVAL_MS: ${CLEAN_START_STAGE_PARTIAL_INTERVAL_MS:-2200}
      CLEAN_START_MIN_STAGE_GROWTH: ${CLEAN_START_MIN_STAGE_GROWTH:-24}
      NATS_URL: nats://nats:4222
      COACH_LLM_SERVICE_URL: ${COACH_LLM_SERVICE_URL:-http://host.docker.internal:8088}
      COACH_LLM_SERVICE_TOKEN: ${COACH_LLM_SERVICE_TOKEN:-}
      SONIOX_API_KEY: ${SONIOX_API_KEY:-}
      SONIOX_STT_MODEL: ${SONIOX_STT_MODEL:-stt-rt-v5}
      SONIOX_AUDIO_FORMAT: ${SONIOX_AUDIO_FORMAT:-s16le}
      SONIOX_LANGUAGE: ${SONIOX_LANGUAGE:-ru}
      INWORLD_API_KEY: ${INWORLD_API_KEY:-}
      CLEAN_START_AUDIO_S3_ENDPOINT: ${CLEAN_START_AUDIO_S3_ENDPOINT:-}
      CLEAN_START_AUDIO_S3_REGION: ${CLEAN_START_AUDIO_S3_REGION:-ru-1}
      CLEAN_START_AUDIO_S3_BUCKET: ${CLEAN_START_AUDIO_S3_BUCKET:-}
      CLEAN_START_AUDIO_S3_ACCESS_KEY: ${CLEAN_START_AUDIO_S3_ACCESS_KEY:-}
      CLEAN_START_AUDIO_S3_SECRET_KEY: ${CLEAN_START_AUDIO_S3_SECRET_KEY:-}
      CLEAN_START_AUDIO_S3_PREFIX: ${CLEAN_START_AUDIO_S3_PREFIX:-rec-audio}
      CLEAN_START_AUDIO_S3_PATH_STYLE: ${CLEAN_START_AUDIO_S3_PATH_STYLE:-true}
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy

  test-agent:
    build:
      context: ..
      dockerfile: clean_start/Dockerfile
    command: ["--role", "test-agent"]
    ports:
      - "8111:8111"
    environment:
      CLEAN_START_HTTP_ADDR: ":8111"
      CLEAN_START_ROLE: test-agent
      NATS_URL: nats://nats:4222
      COACH_LLM_SERVICE_URL: ${COACH_LLM_SERVICE_URL:-http://host.docker.internal:8088}
      COACH_LLM_SERVICE_TOKEN: ${COACH_LLM_SERVICE_TOKEN:-}
      INWORLD_API_KEY: ${INWORLD_API_KEY:-}
      INWORLD_TTS_SELLER_VOICE: ${INWORLD_TTS_SELLER_VOICE:-Elena}
      INWORLD_TTS_CLIENT_VOICE: ${INWORLD_TTS_CLIENT_VOICE:-Arkady}
    depends_on:
      nats:
        condition: service_started

volumes:
  clean-start-postgres-data:
