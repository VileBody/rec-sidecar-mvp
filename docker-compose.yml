services:
  llm-service:
    build:
      context: ./llm_service
    ports:
      - "8088:8088"
    environment:
      COACH_PROVIDER: ${COACH_PROVIDER:-auto}
      COACH_LLM_SERVICE_TOKEN: ${COACH_LLM_SERVICE_TOKEN:-}
      COACH_HELP_OPENER_TIMEOUT_MS: ${COACH_HELP_OPENER_TIMEOUT_MS:-3000}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-zai-glm-4.7}
      CEREBRAS_HELP_OPENER_PRIMARY_MODEL: ${CEREBRAS_HELP_OPENER_PRIMARY_MODEL:-zai-glm-4.7}
      CEREBRAS_HELP_OPENER_SECONDARY_MODEL: ${CEREBRAS_HELP_OPENER_SECONDARY_MODEL:-gpt-oss-120b}
      CEREBRAS_API_BASE: ${CEREBRAS_API_BASE:-https://api.cerebras.ai/v1}
      CEREBRAS_TIMEOUT_SECS: ${CEREBRAS_TIMEOUT_SECS:-30}
      CEREBRAS_RATE_LIMIT_BACKOFF_MS: ${CEREBRAS_RATE_LIMIT_BACKOFF_MS:-15000}
      CEREBRAS_REASONING_EFFORT: ${CEREBRAS_REASONING_EFFORT:-none}
      CEREBRAS_PROMPT_CACHE_KEY: ${CEREBRAS_PROMPT_CACHE_KEY:-true}
      CEREBRAS_PROXY: ${CEREBRAS_PROXY:-}
      OUTBOUND_PROXY: ${OUTBOUND_PROXY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      VERTEX_GEMINI_MODEL: ${VERTEX_GEMINI_MODEL:-gemini-3.5-flash}
      VERTEX_THINKING_LEVEL: ${VERTEX_THINKING_LEVEL:-low}
      VERTEX_ADC_CREDENTIALS: ${VERTEX_ADC_CREDENTIALS:-/root/.config/gcloud/application_default_credentials.json}
      VERTEX_ACCESS_TOKEN: ${VERTEX_ACCESS_TOKEN:-}
      VERTEX_API_BASE: ${VERTEX_API_BASE:-https://aiplatform.googleapis.com}
      GOOGLE_CLOUD_QUOTA_PROJECT: ${GOOGLE_CLOUD_QUOTA_PROJECT:-}
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
