apiVersion: batch/v1
kind: Job
metadata:
  name: botamin-voice-migrate
  namespace: botamin-voice
  labels:
    app.kubernetes.io/name: botamin-voice
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: botamin-voice
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: botamin-voice
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: botamin-voice
    spec:
      restartPolicy: Never
      serviceAccountName: botamin-voice
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: craas-ai-native-paas-registry
      nodeSelector:
        ai-native-paas.io/pool: ci
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ai-native-paas-registry.registry.twcstorage.ru/botamin/voice-agent@sha256:53ac8b60fe9b756403a0bc9be0338d541dd7e53de572392035d77eac944c1254
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - alembic
            - upgrade
            - head
          env:
            - name: APP_ENV
              value: production-demo
            - name: BACKEND_BASE_URL
              value: https://voicechat.teamgenius.ru
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: botamin-voice-secrets
                  key: DATABASE_URL
            - name: VAPI_TOOL_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: botamin-voice-secrets
                  key: VAPI_TOOL_BEARER_TOKEN
            - name: VAPI_ADMIN_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: botamin-voice-secrets
                  key: VAPI_ADMIN_BEARER_TOKEN
            - name: PII_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: botamin-voice-secrets
                  key: PII_ENCRYPTION_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
