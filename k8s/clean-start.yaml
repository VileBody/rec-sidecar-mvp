apiVersion: apps/v1
kind: Deployment
metadata:
  name: clean-start-nats
  namespace: rec-sidecar
  labels:
    app.kubernetes.io/name: clean-start-nats
    app.kubernetes.io/part-of: rec-sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clean-start-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clean-start-nats
        app.kubernetes.io/part-of: rec-sidecar
    spec:
      containers:
        - name: nats
          image: nats:2.11-alpine
          args: ["-js", "-m", "8222"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: clean-start-nats
  namespace: rec-sidecar
  labels:
    app.kubernetes.io/name: clean-start-nats
    app.kubernetes.io/part-of: rec-sidecar
spec:
  selector:
    app.kubernetes.io/name: clean-start-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
---
# Required external secrets:
# - clean-start-postgres: POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
# - clean-start-auth: CLEAN_START_DATABASE_URL, CLEAN_START_JWT_SECRET
# Optional external secrets:
# - clean-start-audio-s3: CLEAN_START_AUDIO_S3_ENDPOINT, CLEAN_START_AUDIO_S3_REGION,
#   CLEAN_START_AUDIO_S3_BUCKET, CLEAN_START_AUDIO_S3_ACCESS_KEY, CLEAN_START_AUDIO_S3_SECRET_KEY
#
# Keep these out of git. See clean_start/README.md for kubectl commands.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clean-start-postgres-data
  namespace: rec-sidecar
  labels:
    app.kubernetes.io/name: clean-start-postgres
    app.kubernetes.io/part-of: rec-sidecar
spec:
  storageClassName: hdd.network-drives.csi.timeweb.cloud
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clean-start-postgres
  namespace: rec-sidecar
  labels:
    app.kubernetes.io/name: clean-start-postgres
    app.kubernetes.io/part-of: rec-sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clean-start-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clean-start-postgres
        app.kubernetes.io/part-of: rec-sidecar
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: clean-start-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clean-start-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: clean-start-postgres
  namespace: rec-sidecar
  labels:
    app.kubernetes.io/name: clean-start-postgres
    app.kubernetes.io/part-of: rec-sidecar
spec:
  selector:
    app.kubernetes.io/name: clean-start-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clean-start-gateway
  namespace: rec-sidecar
  labels:
    app.kubernetes.io/name: clean-start-gateway
    app.kubernetes.io/part-of: rec-sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clean-start-gateway
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
      labels:
        app.kubernetes.io/name: clean-start-gateway
        app.kubernetes.io/part-of: rec-sidecar
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: gateway
          image: ghcr.io/vilebody/rec-sidecar-mvp-clean-start:latest
          imagePullPolicy: Always
          args: ["--role", "gateway"]
          ports:
            - name: http
              containerPort: 8110
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: clean-start-observability-env
            - secretRef:
                name: llm-helper-env
            - secretRef:
                name: clean-start-auth
            - secretRef:
                name: clean-start-audio-s3
                optional: true
          env:
            - name: CLEAN_START_HTTP_ADDR
              value: ":8110"
            - name: CLEAN_START_AUTH_ENABLED
              value: "true"
            - name: CLEAN_START_AUTH_COOKIE_SECURE
              value: "true"
            - name: CLEAN_START_COACH_ENABLED
              value: "true"
            - name: NATS_URL
              value: nats://clean-start-nats:4222
            - name: COACH_LLM_SERVICE_URL
              value: http://llm-helper
            - name: OTEL_SERVICE_NAME
              value: clean-start-gateway
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: clean-start-gateway
  namespace: rec-sidecar
  labels:
    app.kubernetes.io/name: clean-start-gateway
    app.kubernetes.io/part-of: rec-sidecar
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: clean-start-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30916
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clean-start-edge-caddy
  namespace: rec-sidecar
  labels:
    app.kubernetes.io/name: clean-start-edge
    app.kubernetes.io/part-of: rec-sidecar
data:
  Caddyfile: |
    {
      auto_https disable_redirects
    }

    rec.teamgenius.ru {
      tls /etc/caddy/tls/tls.crt /etc/caddy/tls/tls.key

      encode zstd gzip
      reverse_proxy clean-start-gateway.rec-sidecar.svc.cluster.local:80
    }

    suffleur.teamgenius.ru {
      tls {
        issuer acme {
          disable_http_challenge
        }
      }

      encode zstd gzip
      reverse_proxy pulseplus-copilot.rec-sidecar.svc.cluster.local:80
    }

    vietnam.teamgenius.ru {
      tls {
        issuer acme {
          disable_http_challenge
        }
      }

      encode zstd gzip
      reverse_proxy vietnest.vietnam-rent.svc.cluster.local:80
    }

    klukhanova.teamgenius.ru {
      tls {
        issuer acme {
          disable_http_challenge
        }
      }

      encode zstd gzip
      reverse_proxy klukhanova-static.rec-sidecar.svc.cluster.local:80
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clean-start-edge
  namespace: rec-sidecar
  labels:
    app.kubernetes.io/name: clean-start-edge
    app.kubernetes.io/part-of: rec-sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clean-start-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clean-start-edge
        app.kubernetes.io/part-of: rec-sidecar
    spec:
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 443
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: tls
              mountPath: /etc/caddy/tls
              readOnly: true
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: caddyfile
          configMap:
            name: clean-start-edge-caddy
        - name: tls
          secret:
            secretName: clean-start-edge-tls
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: clean-start-edge
  namespace: rec-sidecar
  labels:
    app.kubernetes.io/name: clean-start-edge
    app.kubernetes.io/part-of: rec-sidecar
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: clean-start-edge
  ports:
    - name: https
      port: 443
      targetPort: https
      nodePort: 30443
---
