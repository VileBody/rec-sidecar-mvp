apiVersion: v1
kind: Namespace
metadata:
  name: rec-sidecar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-helper
  namespace: rec-sidecar
  labels:
    app.kubernetes.io/name: llm-helper
    app.kubernetes.io/part-of: rec-sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-helper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-helper
        app.kubernetes.io/part-of: rec-sidecar
    spec:
      containers:
        - name: llm-helper
          image: ghcr.io/vilebody/rec-sidecar-mvp:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - secretRef:
                name: llm-helper-env
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-helper
  namespace: rec-sidecar
  labels:
    app.kubernetes.io/name: llm-helper
    app.kubernetes.io/part-of: rec-sidecar
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: llm-helper
  ports:
    - name: http
      port: 80
      targetPort: http
