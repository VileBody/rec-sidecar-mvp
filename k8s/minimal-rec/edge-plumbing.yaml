apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-lb-health-nginx
  namespace: rec-sidecar
  labels:
    ai-native-paas.io/scope: legacy-quarantine
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /health {
        default_type text/plain;
        return 200 "ok\n";
      }

      location / {
        return 308 https://$host$request_uri;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-lb-health
  namespace: rec-sidecar
  labels:
    ai-native-paas.io/scope: legacy-quarantine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: legacy-lb-health
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legacy-lb-health
        ai-native-paas.io/scope: legacy-quarantine
    spec:
      nodeSelector:
        ai-native-paas.io/pool: ci
      imagePullSecrets:
        - name: craas-ai-native-paas-registry
      containers:
        - name: nginx
          image: ai-native-paas-registry.registry.twcstorage.ru/mirror/legacy/nginx@sha256:62223d644fa234c3a1cc785ee14242ec47a77364226f1c811d2f669f96dc2ac8
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: config
          configMap:
            name: legacy-lb-health-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-lb-health
  namespace: rec-sidecar
  labels:
    ai-native-paas.io/scope: legacy-quarantine
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: legacy-lb-health
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30870
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-edge-https
  namespace: rec-sidecar
  labels:
    ai-native-paas.io/scope: legacy-quarantine
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: legacy-edge-tcp
  ports:
    - name: https
      port: 443
      targetPort: https
      nodePort: 31443
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-edge-tcp-nginx
  namespace: rec-sidecar
  labels:
    ai-native-paas.io/scope: legacy-quarantine
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;

    events {
      worker_connections 256;
    }

    stream {
      upstream caddy_edge {
        server clean-start-edge.rec-sidecar.svc.cluster.local:443;
      }

      server {
        listen 8443;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
        proxy_pass caddy_edge;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-edge-tcp
  namespace: rec-sidecar
  labels:
    app.kubernetes.io/name: legacy-edge-tcp
    ai-native-paas.io/scope: legacy-quarantine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: legacy-edge-tcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legacy-edge-tcp
        ai-native-paas.io/scope: legacy-quarantine
    spec:
      nodeSelector:
        ai-native-paas.io/pool: ci
      imagePullSecrets:
        - name: craas-ai-native-paas-registry
      containers:
        - name: nginx
          image: ai-native-paas-registry.registry.twcstorage.ru/mirror/legacy/nginx@sha256:62223d644fa234c3a1cc785ee14242ec47a77364226f1c811d2f669f96dc2ac8
          command:
            - nginx
            - -g
            - daemon off;
            - -c
            - /etc/nginx/nginx.conf
          ports:
            - name: https
              containerPort: 8443
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: https
          livenessProbe:
            tcpSocket:
              port: https
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: legacy-edge-tcp-nginx
        - name: tmp
          emptyDir: {}
